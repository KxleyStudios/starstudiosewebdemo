<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta property="og:title" content="Careers - Star Studios">
    <meta property="og:description" content="Join the Star Studios team. Remote, volunteer-based positions across editorial, animation, art, voice, sound, and story.">
    <meta property="og:image" content="https://starstudiosproductionco.com/favicon.png">
    <meta property="og:url" content="https://starstudiosproductionco.com/careers">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#7B2CBF">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Star Studios</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="careers.css">
</head>
<body>
    <div id="site-background" aria-hidden="true"></div>

    <nav class="topnav">
        <a href="../" class="topnav-btn">‹ Back to Star Studios</a>
    </nav>

    <div class="container">
        <header>
            <a href="../"><img src="../logo.png" alt="Studio Logo" class="logo"></a>
        </header>

        <section class="careers-hero">
            <h1>JOIN THE TEAM</h1>
            <p id="careers-about"></p>
        </section>

        <h2 class="careers-section-title">OPEN POSITIONS</h2>
        <section class="careers-list" id="careers-list">
            <!-- Career cards are rendered by careers-list.js -->
        </section>

        <h2 class="careers-section-title">WHAT WE OFFER</h2>
        <section class="offer-grid" id="offer-grid">
            <!-- Offer cards rendered by careers-list.js -->
        </section>

        <h2 class="careers-section-title">OUR VALUES</h2>
        <section class="values-grid" id="values-grid">
            <!-- Value cards rendered by careers-list.js -->
        </section>

        <div class="inclusivity-block" id="inclusivity-block"></div>
    </div>

    <script src="js/careers-data.js"></script>
    <script src="js/careers-common.js"></script>
    <script src="js/careers-list.js"></script>

</body>
</html>
